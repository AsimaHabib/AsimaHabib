name: Generate Snake Animation

on:
  # Rebuild every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild when this workflow changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: AsimaHabib
          outputs: |
            dist/github-snake.svg?color_snake=#0f766e
            dist/github-snake-dark.svg?color_snake=#22d3ee&color_dots=#0f2a3d,#0e4f5c,#0f766e,#14b8a6,#5eead4
            dist/github-snake-dark.gif?palette=github-dark&color_snake=#22d3ee&color_dots=#0f2a3d,#0e4f5c,#0f766e,#14b8a6,#5eead4

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
